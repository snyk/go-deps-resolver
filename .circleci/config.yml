version: 2.1

orbs:
  # Snyk-owned orbs: track the latest release of the major version
  prodsec: snyk/prodsec-orb@1
  # Third-party orbs: always pin an exact version
  go: circleci/go@4.0.3

jobs:
  security-scans:
    resource_class: small
    executor:
      name: go/default
      tag: "1.26"
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          iac-scan: disabled

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master

      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
